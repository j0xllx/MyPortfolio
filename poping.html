<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Details</title>
  <link rel="stylesheet" href="poping.css">
</head>
<body>
  <div class="popup-container">
    <!-- Close Button -->
    <button class="close-btn" onclick="window.close()">✕</button>

    <!-- Content Wrapper -->
    <div class="popup-content">
      <div class="popup-image-container">
        <img id="popup-img" src="" alt="Project Preview" class="popup-image">
      </div>

      <div class="popup-text-container">
        <h2 id="popup-title"></h2>
        <p id="popup-desc" class="popup-description"></p>

        <!-- View Design Button -->
        <a id="design-link" href="#" target="_blank" class="popup-link">View Design</a>
      </div>
    </div>

    <!-- Embed Area -->
    <div class="figma-embed">
      <iframe
        id="design-iframe"
        style="border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 10px;"
        width="100%"
        height="450"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  <script>
    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const title = urlParams.get('title');
    const desc = urlParams.get('desc');
    const img = urlParams.get('img');
    const design = urlParams.get('figma'); // Keep using "figma" for now for backward compatibility

    // Populate dynamic content
    document.getElementById('popup-title').textContent = decodeURIComponent(title);
    document.getElementById('popup-desc').textContent = decodeURIComponent(desc);
    document.getElementById('popup-img').src = decodeURIComponent(img);

    const designURL = decodeURIComponent(design);
    const designIframe = document.getElementById('design-iframe');
    const designLink = document.getElementById('design-link');

    // Detect if it's a Canva or Figma link and embed accordingly
    if (designURL.includes("figma.com")) {
      designIframe.src = `https://www.figma.com/embed?embed_host=share&url=${designURL}`;
      designLink.textContent = "View on Figma";
    } else if (designURL.includes("canva.com")) {
      designIframe.src = designURL;
      designLink.textContent = "View on Canva";
    } else {
      // Default fallback
      designIframe.src = designURL;
      designLink.textContent = "View Design";
    }

    // Set the link target
    designLink.href = designURL;
  </script>
</body>
</html>
