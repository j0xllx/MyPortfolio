<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

#certificates{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    overflow-y:auto;
    padding:40px;
}

.exit-btn{
    position:absolute;
    top:15px;
    right:20px;
    font-size:25px;
    border:none;
    background:none;
    cursor:pointer;
}

.cert-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-top:40px;
}

.cert-container img{
    width:300px;
    height:auto;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:transform 0.3s;
}

.cert-container img:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<section id="certificates">

<button class="exit-btn" onclick="closeCertificates()">✖</button>

<div class="cert-container">
    <img src="certificate1.jpg" alt="Certificate 1">
    <img src="certificate2.jpg" alt="Certificate 2">
    <img src="certificate3.jpg" alt="Certificate 3">
</div>

</section>

<script>
function closeCertificates(){
    document.getElementById("certificates").style.display = "none";
}
</script>

</body>
</html>
