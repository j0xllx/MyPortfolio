<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates Gallery</title>
<style>
/* Basic styles */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* Certificates Section Overlay */
#certificates {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.97);
    overflow-y: auto;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 999;
}

/* Exit Button */
.exit-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 28px;
    background: none;
    border: none;
    cursor: pointer;
}

/* Section Title */
#certificates h2 {
    margin-top: 0;
    margin-bottom: 30px;
    font-size: 28px;
    color: #333;
}

/* Certificate Grid */
.cert-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    width: 100%;
    max-width: 1200px;
}

/* Individual Certificates */
.cert-container img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.cert-container img:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* Modal for Large View */
#certModal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}

#certModal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
}

#certModal .closeModal {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 30px;
    color: white;
    cursor: pointer;
    background: none;
    border: none;
}
</style>
</head>
<body>

<section id="certificates">
    <button class="exit-btn" onclick="closeCertificates()">✖</button>
    <h2>My Certificates</h2>
    <div class="cert-container">
        <img src="certificate1.jpg" alt="Certificate 1" onclick="openModal(this)">
        <img src="certificate2.jpg" alt="Certificate 2" onclick="openModal(this)">
        <img src="certificate3.jpg" alt="Certificate 3" onclick="openModal(this)">
        <!-- Add more certificates as needed -->
    </div>
</section>

<!-- Modal for large view -->
<div id="certModal" onclick="closeModal()">
    <button class="closeModal" onclick="closeModal(event)">✖</button>
    <img id="modalImg" src="" alt="Certificate Large View">
</div>

<script>
// Exit button
function closeCertificates(){
    document.getElementById("certificates").style.display = "none";
}

// Open modal on certificate click
function openModal(img){
    document.getElementById("certModal").style.display = "flex";
    document.getElementById("modalImg").src = img.src;
}

// Close modal
function closeModal(event){
    if(event) event.stopPropagation(); // Prevent closing the overlay by clicking the close button twice
    document.getElementById("certModal").style.display = "none";
}
</script>

</body>
</html>
