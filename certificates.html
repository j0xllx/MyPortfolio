<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#eef2f7,#d9e4f5);
}

/* Certificate Section */
#certificates{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(120deg,#ffffff,#f3f6fb);
    padding:40px;
    overflow-y:auto;
}

/* Exit Button */
.exit-btn{
    position:absolute;
    top:20px;
    right:30px;
    font-size:26px;
    border:none;
    background:white;
    width:45px;
    height:45px;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    transition:all 0.25s ease;
}

.exit-btn:hover{
    background:#ff4d4d;
    color:white;
    transform:scale(1.1);
}

/* Title */
h2{
    text-align:center;
    margin-bottom:40px;
    font-size:32px;
    letter-spacing:1px;
    color:#2c3e50;
}

/* Grid Layout */
.cert-container{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(350px,1fr));
    gap:25px;
    max-width:1200px;
    margin:auto;
}

/* PDF Viewer */
.cert-container iframe{
    width:100%;
    height:500px;
    border-radius:12px;
    border:none;
    background:white;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.cert-container iframe:hover{
    transform:translateY(-6px) scale(1.02);
    box-shadow:0 12px 28px rgba(0,0,0,0.25);
}
</style>
</head>

<body>

<section id="certificates">

<button class="exit-btn" onclick="closeCertificates()">✖</button>

<h2>My Certificates</h2>

<div class="cert-container">

<iframe src="files/Cert1.pdf"></iframe>
<iframe src="files/Cert2.pdf"></iframe>
<iframe src="files/Cert3.pdf"></iframe>
<iframe src="files/Cert4.pdf"></iframe>
<iframe src="files/Cert5.pdf"></iframe>

</div>

</section>

<script>
function closeCertificates(){
document.getElementById("certificates").style.display="none";
}
</script>

</body>
</html>
