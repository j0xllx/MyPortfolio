<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

#certificates{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    padding:40px;
    overflow-y:auto;
}

.exit-btn{
    position:absolute;
    top:20px;
    right:30px;
    font-size:28px;
    border:none;
    background:none;
    cursor:pointer;
}

h2{
    text-align:center;
    margin-bottom:30px;
}

.cert-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:25px;
}

.cert-container iframe{
    width:100%;
    height:500px;
    border:1px solid #ddd;
    border-radius:10px;
}
</style>
</head>

<body>

<section id="certificates">

<button class="exit-btn" onclick="closeCertificates()">✖</button>

<h2>My Certificates</h2>

<div class="cert-container">

<iframe src="certificate1.pdf#toolbar=0"></iframe>
<iframe src="certificate2.pdf#toolbar=0"></iframe>
<iframe src="certificate3.pdf#toolbar=0"></iframe>

</div>

</section>

<script>
function closeCertificates(){
    document.getElementById("certificates").style.display="none";
}
</script>

</body>
</html>
