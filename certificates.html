<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates Section</title>
  <style>
    /* Full-screen overlay for certificates */
    #certificates-section {
      display: none; /* Hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      overflow-y: auto;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Exit button */
    #certificates-section .exit-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #ff4d4d;
      border: none;
      color: white;
      font-size: 18px;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
    }

    /* Container for certificates */
    .certificates-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 60px; /* Leave space for exit button */
    }

    .certificates-container img {
      max-width: 300px;
      max-height: 200px;
      object-fit: cover;
      border: 2px solid white;
      border-radius: 5px;
      box-shadow: 0 0 10px #000;
    }
  </style>
</head>
<body>

  <!-- Certificates Section -->
  <div id="certificates-section">
    <button class="exit-btn" onclick="closeCertificates()">Exit</button>
    <div class="certificates-container">
      <img src="certificate1.jpg" alt="Certificate 1">
      <img src="certificate2.jpg" alt="Certificate 2">
      <img src="certificate3.jpg" alt="Certificate 3">
      <!-- Add more certificates as needed -->
    </div>
  </div>

  <!-- Example button to open certificates -->
  <button onclick="openCertificates()">View Certificates</button>

  <script>
    function openCertificates() {
      document.getElementById('certificates-section').style.display = 'block';
    }

    function closeCertificates() {
      document.getElementById('certificates-section').style.display = 'none';
    }
  </script>

</body>
</html>
