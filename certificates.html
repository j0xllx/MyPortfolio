<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates Section</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

#certificates {
    padding: 20px;
}

.exit-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    font-size: 24px;
    border: none;
    background: none;
    cursor: pointer;
}

.cert-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-top: 50px;
}

.cert-container img {
    width: 300px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.cert-container img:hover {
    transform: scale(1.05);
}
</style>
</head>
<body>

<section id="certificates">
    <button class="exit-btn" onclick="closeCertificates()">✖</button>
    <div class="cert-container">
        <img src="certificate1.jpg" alt="Certificate 1">
        <img src="certificate2.jpg" alt="Certificate 2">
        <img src="certificate3.jpg" alt="Certificate 3">
    </div>
</section>

<script>
function closeCertificates() {
    document.getElementById("certificates").style.display = "none";
}
</script>

</body>
</html>
