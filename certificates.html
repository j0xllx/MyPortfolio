<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

/* Certificate Section */
#certificates{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    padding:30px;
    overflow-y:auto;
}

/* Exit Button */
.exit-btn{
    position:absolute;
    top:20px;
    right:30px;
    font-size:28px;
    border:none;
    background:none;
    cursor:pointer;
}

/* Title */
h2{
    text-align:center;
    margin-bottom:30px;
}

/* Grid Layout */
.cert-container{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(350px,1fr));
    gap:20px;
}

/* PDF Viewer */
.cert-container iframe{
    width:100%;
    height:500px;
    border-radius:10px;
    border:1px solid #ddd;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<section id="certificates">

<button class="exit-btn" onclick="closeCertificates()">✖</button>

<h2>My Certificates</h2>

<div class="cert-container">

<iframe src="files/Cert1.pdf"></iframe>
<iframe src="files/Cert2.pdf"></iframe>
<iframe src="files/Cert3.pdf"></iframe>
<iframe src="files/Cert4.pdf"></iframe>
<iframe src="files/Cert5.pdf"></iframe>

</div>

</section>

<script>
function closeCertificates(){
document.getElementById("certificates").style.display="none";
}
</script>

</body>
</html>
