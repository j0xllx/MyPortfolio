<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Certificates</title>
<style>

/* Certificates Section */
#certificates-section {
  display: none; /* hidden initially */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  background: rgba(51, 8, 57, 0.95); /* dark overlay */
  color: white;
  padding: 50px 20px;
  z-index: 1000;
  text-align: center;
}

/* Exit button */
#cert-exit {
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 36px;
  background: transparent;
  border: none;
  color: white;
  cursor: pointer;
  z-index: 1100;
}

/* Section title */
#certificates-section h2 {
  font-size: 36px;
  margin-bottom: 40px;
  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

/* Gallery layout */
.certificates-gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
}

/* Certificate images */
.certificates-gallery img {
  width: 400px; /* landscape style */
  height: 250px;
  object-fit: cover;
  border: 2px solid #fff;
  border-radius: 10px;
  box-shadow: 0 8px 12px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.certificates-gallery img:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 20px rgba(0,0,0,0.7);
}
</style>
</head>
<body>



<!-- Certificates Section -->
<section id="certificates-section">
  <button id="cert-exit">✕</button>
  <h2>My Certificates</h2>
  <div class="certificates-gallery">
    <img src="cert1.jpg" alt="Certificate 1">
    <img src="cert2.jpg" alt="Certificate 2">
    <img src="cert3.jpg" alt="Certificate 3">
    <!-- Add more certificate images as needed -->
  </div>
</section>

<script>
// Get elements
const certSection = document.getElementById('certificates-section');
const exitBtn = document.getElementById('cert-exit');

// Show certificates section when button is clicked
certBtn.addEventListener('click', () => {
  certSection.style.display = 'block';
});

// Hide certificates section when exit button is clicked
exitBtn.addEventListener('click', () => {
  certSection.style.display = 'none';
});
</script>

</body>
</html>
